[project]
name = "terminal-mcp"
version = "0.1.0"
description = "Local, session-oriented terminal tools over MCP stdio"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.scripts]
terminal-mcp = "terminal_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
